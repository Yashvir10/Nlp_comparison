name: Python AI/ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Cache pip packages
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Check Python syntax
      - name: Lint
        run: |
          pip install flake8
          flake8 . --count --max-line-length=100 --statistics

      # Run unit tests
      - name: Run tests
        run: |
          pytest

      # Verify FastAPI app imports
      - name: Verify API
        run: |
          python -c "import main"

      # Verify model loads (optional)
      - name: Check model loading
        run: |
          python test_model.py
